<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareerPilot Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#0f1115; color:#e6e6e6; }
    .card { background:#1a1d24; border:1px solid #2a2e38; }
    .stat { font-size:2rem; font-weight:700; color:#4da3ff; }
    .muted { color:#9aa0ac; font-size:.85rem; }
    table { color:#e6e6e6 !important; font-size:.85rem; }
    h5 { color:#9aa0ac; text-transform:uppercase; font-size:.8rem; letter-spacing:.05em; }
    .accent { color:#4da3ff; }
  </style>
</head>
<body>
<div class="container-fluid py-4">
  <h3 class="mb-4"><span class="accent">CareerPilot</span> Dashboard
    <span class="muted">— auto-refresh {{ refresh }}s</span></h3>

  <div class="row g-3 mb-4" id="stat-cards"></div>

  <div class="row g-3">
    <div class="col-lg-6">
      <div class="card p-3"><h5>Recent Jobs</h5>
        <div class="table-responsive" id="jobs"></div></div>
    </div>
    <div class="col-lg-6">
      <div class="card p-3"><h5>Recent Applications</h5>
        <div class="table-responsive" id="applications"></div></div>
    </div>
    <div class="col-lg-4">
      <div class="card p-3"><h5>Rejection Reasons</h5>
        <div id="rejections"></div></div>
    </div>
    <div class="col-lg-4">
      <div class="card p-3"><h5>AI Usage</h5>
        <div id="ai"></div></div>
    </div>
    <div class="col-lg-4">
      <div class="card p-3"><h5>Resume Usage</h5>
        <div id="resume"></div></div>
    </div>
  </div>
</div>

<script>
const REFRESH = {{ refresh }} * 1000;

function table(rows) {
  if (!rows.length) return '<p class="muted">No data yet.</p>';
  const cols = Object.keys(rows[0]);
  let h = '<table class="table table-dark table-sm table-striped"><thead><tr>';
  cols.forEach(c => h += `<th>${c}</th>`);
  h += '</tr></thead><tbody>';
  rows.forEach(r => { h += '<tr>'; cols.forEach(c => h += `<td>${r[c] ?? ''}</td>`); h += '</tr>'; });
  return h + '</tbody></table>';
}

async function load() {
  try {
    const stats = await (await fetch('/api/stats')).json();
    const cards = [
      ['Applications', stats.applications],
      ['Failed', stats.failed],
      ['Matched', stats.by_status.MATCHED || 0],
      ['Rejected', stats.by_status.REJECTED || 0],
      ['Found', stats.by_status.FOUND || 0],
      ['Manual Review', stats.by_status.MANUAL_REVIEW || 0],
    ];
    document.getElementById('stat-cards').innerHTML = cards.map(([k,v]) =>
      `<div class="col"><div class="card p-3 text-center"><div class="stat">${v}</div><div class="muted">${k}</div></div></div>`).join('');

    document.getElementById('jobs').innerHTML = table(await (await fetch('/api/jobs')).json());
    document.getElementById('applications').innerHTML = table(await (await fetch('/api/applications')).json());
    document.getElementById('rejections').innerHTML = table(await (await fetch('/api/rejections')).json());
    document.getElementById('ai').innerHTML = table(await (await fetch('/api/ai')).json());
    document.getElementById('resume').innerHTML = table(await (await fetch('/api/resume_usage')).json());
  } catch (e) { console.error(e); }
}
load();
setInterval(load, REFRESH);
</script>
</body>
</html>
