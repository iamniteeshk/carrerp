<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareerPilot Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#0f1115; color:#e6e6e6; min-height:100vh; display:flex; align-items:center; }
    .card { background:#1a1d24; border:1px solid #2a2e38; max-width:420px; width:100%; }
    .accent { color:#4da3ff; }
    .muted { color:#9aa0ac; font-size:.85rem; }
  </style>
</head>
<body>
<div class="container d-flex justify-content-center">
  <div class="card p-4">
    <h4 class="mb-1"><span class="accent">CareerPilot</span> Admin</h4>
    <p class="muted mb-3">Sign in to approve rejected jobs or change settings. Stats stay public.</p>
    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input class="form-control bg-dark text-light border-secondary" name="username" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control bg-dark text-light border-secondary" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Sign in</button>
    </form>
    <p class="muted mt-3 mb-0">Credentials come from <code>DASHBOARD_USER</code> / <code>DASHBOARD_PASSWORD</code> in <code>.env</code>.</p>
  </div>
</div>
</body>
</html>
